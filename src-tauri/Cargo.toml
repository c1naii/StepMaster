[package]
name = "stepmaster"
version = "1.0.2"
description = "StepMaster - Windows toolkit"
edition = "2021"
rust-version = "1.80"

[lib]
name = "stepmaster_lib"
crate-type = ["rlib"]

[[bin]]
name = "stepmaster"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
winreg = "0.52"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["time", "rt"] }
minisign-verify = "0.2"
base64 = "0.22"
rayon = "1"
trash = "5"
blake3 = "1"
parking_lot = "0.12"
once_cell = "1"
png = "0.18"

[dependencies.windows-sys]
version = "0.59"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_NetworkManagement_WiFi",
  "Win32_Networking_WinInet",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Power",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "unwind"
strip = true
